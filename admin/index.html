<div class="shell" id="shell" hidden><aside><div class="brand">Susu<span>.</span><small>内容管理后台</small></div><nav id="nav" aria-label="后台导航"></nav><div class="account"><img id="account-avatar" src="../assets/susu-avatar.png" alt=""><div><strong id="account-name">susu5</strong><small>站点管理员</small></div><button id="logout" type="button">退出</button></div></aside><div><header><span id="connection-status" class="mark kicker" role="status">正在连接</span><div class="admin-header-actions"><button class="btn" id="refresh-state" type="button">刷新内容</button><a href="/" target="_blank" rel="noopener">查看网站 ↗</a><button class="mobile-logout" id="mobile-logout" type="button">退出</button></div></header><div id="publication-status" class="publication-status" role="status" hidden></div><main id="main" tabindex="-1"></main></div></div>
<section class="login-screen" id="login" aria-label="后台登录"></section>
<dialog id="confirm"><form method="dialog"><h2>发布到网站</h2><p id="publish-description">发布当前内容到 susu5.cn，其他草稿不会一起发布。</p><div class="actions"><button class="btn" value="cancel">返回</button><button class="btn primary" value="publish">确认发布</button></div></form></dialog>
<dialog id="delete-dialog"><form method="dialog"><h2>删除内容</h2><p>确认删除「<span id="delete-name"></span>」？如果它已发布，网站中的对应内容也会移除。</p><div class="actions"><button class="btn" value="cancel">取消</button><button class="btn danger" value="delete">确认删除</button></div></form></dialog>
<dialog id="front" class="front-preview"><form method="dialog"><button class="btn">关闭预览</button></form><div id="front-content"></div></dialog>
<dialog id="maintenance-restore-dialog"><form method="dialog"><h2>恢复到后台草稿</h2><p id="maintenance-restore-description"></p><div class="actions"><button class="btn" value="cancel">取消</button><button class="btn primary" value="restore">确认恢复草稿</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div><noscript>后台需要 JavaScript。请启用后刷新页面。</noscript>
